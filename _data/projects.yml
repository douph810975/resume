- project: Identification of Collusive Adversaries from a Single Adversarial Example via Machine Learning Watermarks
  role: Algorithm Design & Model Training
  duration: Sep 2023 &mdash; Apr 2024
  url: "https://github.com/HUWENBIN2024/fyp_adv_collusion_tracing"
  description: >
